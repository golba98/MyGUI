name: Linux build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libglfw3-dev libgl1-mesa-dev libfreetype-dev xvfb xauth
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Headless and OpenGL tests
        run: xvfb-run -a ctest --preset ${{ matrix.preset }}
      - name: Demo and example smoke tests from another directory
        run: |
          cd /tmp
          for example in MyGUI MyGUI_hello MyGUI_layout MyGUI_widgets; do
            xvfb-run -a "$GITHUB_WORKSPACE/build/${{ matrix.preset }}/$example" --frames 3
          done
